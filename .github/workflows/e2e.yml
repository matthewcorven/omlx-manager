name: E2E (Playwright)

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev, insider]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app under test is a static dashboard, so there is no build step.
      # If a build is ever added, it must run here — once, before Playwright boots.
      - name: Build
        run: |
          echo "No build step - dashboard/index.html is served statically."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # webServer stdout is not forwarded into the Actions log, so a server-side
      # exception is otherwise invisible. Tee the whole run (which includes the
      # [WebServer] lines) to a file that is always uploaded.
      - name: Run Playwright tests
        run: |
          set -o pipefail
          mkdir -p .e2e-logs
          npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }} 2>&1 \
            | tee .e2e-logs/playwright.log

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.shard }}
          path: .e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 90
          if-no-files-found: ignore

  report:
    name: Merge Playwright report
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 90
          if-no-files-found: ignore
